<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Reservaciones | Sports Club Bonachón</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link href="styles.css" rel="stylesheet">
</head>

<body>

  <!-- Encabezado -->
  <header class="header text-center py-3">
    <img src="img/LogoMatizadoSinFondo.png" alt="Logo" class="logo">
    <h1 class="h1 mb-1">Reservaciones del Día</h1>
    <div id="fecha-hora" class="fs-5"></div>
  </header>

  <!-- Contenedor principal -->
  <div class="container-fluid mt-3">

    <!-- Contenido centrado -->
    <div class="row justify-content-center">

      <!-- Zona izquierda - se ocultará en móvil -->
      <div class="col-lg-3 d-none d-lg-block text-center mb-3">
        <div id="media-izq" class="media"></div>
      </div>

      <!-- TABLERO CENTRAL -->
      <div class="col-12 col-lg-6">
        <div class="table-responsive">
          <div id="tabla"></div>
        </div>
      </div>

      <!-- Zona derecha - se ocultará en móvil -->
      <div class="col-lg-3 d-none d-lg-block text-center mb-3">
        <div id="media-der" class="media"></div>
      </div>

    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Scripts personalizados -->
  <script src="scripts.js"></script>

</body>
</html>
